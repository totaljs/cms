<style>
	.CLASS .dg-colorize { display: block; padding: 0 5px; }
</style>

<ui-plugin config="aclass:1">

	<div class="toolbar pin">
		<button class="exec" data-exec="?/create"><i class="ti ti-plus-circle"></i>@(Create)</button>
		<button class="exec" data-exec="?/refresh"><i class="ti ti-refresh"></i>@(Refresh)</button>
		<button class="exec" data-exec="?/menu"><i class="ti ti-cog"></i>@(Options)</button>
	</div>

	<ui-component name="datagrid" path="?.items" config="margin:0;exec:?/filter;parent:window;noborder:1;button:?/buttons;click:?/edit;checked:?.checked">
		<script type="text/plain">
			[
				{ name: 'subject', text: '@(Subject)', width: 300, template: '{{ if !processed }}<span class="badge badge-red badge-medium mr5">@(Unprocessed)</span><span class="b">{{ subject }}</span>{{ else }}{{ subject }}{{ fi }}' },
				{ name: 'name', text: '@(Name)', width: 200 },
				{ name: 'email', text: '@(E-mail)', width: 200 },
				{ name: 'note', text: '@(Note)', width: 300 },
				{ name: 'dtcreated', text: '@(Created)', format: '[ts]', type: 'date', align: 1 },
				{ name: '@(Options)', filter: false, align: 1, sort: false, width: 120, template: '<div class="inline"><button title="@(Update)" name="edit"><i class="ti ti-pencil"></i></button><button title="@(Remove)" name="remove"><i class="ti ti-trash"></i></button></div>' }
			]
		</script>
	</ui-component>

</ui-plugin>

<ui-component name="importer" path="*form" config="if:formcontactform;url:/_contactforms/form.html"></ui-component>

<script>

	PLUGIN(function(exports) {

		exports.hashtag = true;

		let init = false;

		exports.reload = function(id) {
			BREADCRUMB.add('@(Contact forms)', NAV.url);
			if (init)
				exports.refresh();
			else
				init = true;

		};

		exports.refresh = function(el) {
			exports.nul('items');
		};

		exports.filter = function(type, filter, sort, page) {

			if (!filter)
				filter = {};

			filter.sort = sort;
			filter.page = page;

			exports.tapi(QUERIFY('ContactForms', filter) + ' @showloading ERROR', function(response) {
				exports.set('items @hideloading', response, type === 'refresh' ? 'noscroll' : null);
			});

		};

		exports.menu = function(el) {

			var model = exports.model;
			var opt = {};
			opt.element = el;
			opt.align = 'right';
			opt.items = [];

			opt.items.push({ id: 'rebuild', name: '@(Rebuild CMS widget)', icon: 'ti ti-plug' });

			if (model.checked && model.checked.length)
				opt.items.push({ id: 'remove', name: '@(Remove selected ({0}x))'.format(model.checked.length), icon: 'ti ti-trash red' });

			opt.items.push({ id: 'clear', name: '@(Clear all)', icon: 'ti ti-trash red', disabled: model.items.items.length == 0 });

			opt.callback = function(item) {

				if (item.id === 'remove') {
					SETTER('approve/show', '@(Are you sure you want to remove selected ({0}x) contact forms?)'.format(model.checked.length), '"ti ti-trash" @(Clear)', function() {
						SETTER('loading/show');
						model.checked.wait(function(item, next) {
							exports.tapi('Posts|remove', { id: item.id }, next);
						}, exports.refresh);
					});
					return;
				}

				if (item.id === 'clear') {
					SETTER('approve/show', '@(Are you sure you want to clear all contact forms?)', '"ti ti-trash" @(Clear)', () => exports.tapi('Posts|clear @showloading', exports.refresh));
					return;
				}

				if (item.id === 'rebuild')
					exports.tapi('ContactForms|rebuild ERROR', () => FLAGS('@done'));

			};
			SETTER('menu/show', opt);
		};

		exports.edit = function(el) {
			var id = ATTRD(el);
			exports.tapi('ContactForms|read @showloading ERROR', { id: id }, function(response) {
				SET('formcontactform @reset @hideloading', response);
				SET('*form', 'formcontactform');
			});
		};

		exports.remove = function(el) {
			var id = ATTRD(el);
			var data = exports.model.items.items.findItem('id', id);
			SETTER('approve/show', '@(Are you sure you want to remove the contact form?)'.args(data, 'escape'), '"ti ti-trash" @(Remove)', function() {
				exports.tapi('ContactForms|remove ERROR', { id: id }, exports.refresh);
			});
		};

		exports.buttons = function(btn, row) {
			exports[btn](row);
		};

		exports.create = function() {
			SET('formcontactform @default', { body: '' });
			SET('*form', 'formcontactform');
		};

	});

</script>
