<style>
	.CLASS h3 { margin: 0 10px; }
	.CLASS figure { cursor: pointer; margin-bottom: var(--gap); position: relative; }
	.CLASS figure > section { border-radius: var(--radius); border: 1px solid #eaeaea; margin: 10px 10px 0; padding: 0; text-align: left; background-color: #fff; }
	.CLASS figure .meta { padding: 18px 0 5px 15px; border-top: 1px solid #eaeaea; height: 56px; }
	.CLASS figure .name { text-overflow: ellipsis; white-space: nowrap; overflow: hidden; }
	.CLASS figure .options { float: right; margin: 0 15px 0 0; color: gray; }
	.CLASS figure .options:hover { color: #333; }
	.CLASS figure img { border-radius: var(--radius) var(--radius) 0 0; width: 100%; max-width: 234px; }
</style>

<ui-plugin class="CLASS">

	<div class="toolbar pin">
		<button class="exec" data-exec="?/create"><i class="ti ti-plus-circle green mr5"></i>@(Create)</button>
		<button class="exec b" data-exec="?/import"><i class="ti ti-arrow-circle-down mr5"></i>@(Import)</button>
		<button class="exec" data-exec="?/refresh"><i class="ti ti-refresh mr5"></i>@(Refresh)</button>
	</div>

	<ui-component name="empty" path="?.items" config="parent:auto" class="invisible">

		<script type="text/html">
			@(No data found)
		</script>

		<ui-component name="viewbox" path="*page" config="parent:auto;margin:0;scrollbarshadow:1">
			<div class="maxwidth">
				<ui-component name="display" class="padding invisible">
					<h2 style="padding-left:10px;margin-bottom:5px">@(Widgets)</h2>
					<ui-bind path="?.items" config="template:figure" class="grid-lg-5 grid-md-4 grid-sm-3 grid-xs-2">
						<script type="text/html">
							{{ foreach m in value }}
								<figure data-id="{{ m.id }}"{{ if !m.external }} class="exec" data-exec="?/edit"{{ else }} style="cursor:default"{{ fi }}>
									<section>
										{{ if m.external }}
										<span class="badge badge-red badge-small" style="position:absolute;right:20px;top:20px">@(Internal)</span>
										{{ fi }}
										<img src="{{ if m.preview }}{{ m.preview }}{{ else }}/~ID~/empty.png{{ fi }}" onerror="onImageError(this)" data-empty="/~ID~/empty.png" class="img-responsive" loading="lazy" />
										<div class="meta">
											{{ if !m.external }}
											<span class="exec options" data-exec="?/options" data-prevent="true"><i class="ti ti-cog"></i></span>
											{{ fi }}
											<div class="name">{{ m.name }}</div>
										</div>
									</section>
								</figure>
							{{ end }}
						</script>
					</ui-bind>
				</ui-component>
			</div>
		</ui-component>
	</ui-component>

</ui-plugin>

<script>

	PLUGIN(function(exports) {

		exports.reload = function() {
			BREADCRUMB.add('@(Widgets)', NAV.url);
			exports.refresh();
		};

		exports.create = function() {
			var opt = {};
			exports.ajax('GET /~ID~/widget.txt', function(response) {
				opt.body = response || '';
				opt.callback = function(value, hide) {
					var model = {};
					model.html = value;
					exports.tapi('Widgets|save @showloading ERROR', model, function() {
						exports.refresh();
						hide();
					});
				};
				SETTER('loading/hide', 1000);
				FUNC.code(opt);
			});
		};

		exports.import = function() {
			SET('*form2', 'formwidgets');
		};

		exports.refresh = function(el) {
			el && el.find('i').aclass('ti-spin').rclass('ti-spin', 800);
			exports.tapi('Widgets?list=1 @showloading ERROR', function(response) {
				for (var item of response) {
					if (item.name) {
						item.html = '<img src="{0}" style="width:30px" class="mr10" />{1}'.format(item.preview, item.name.encode());
						item.search = item.name.toSearch();
					}
				}

				response.quicksort('name');
				exports.set('items @hideloading', response);
			});
		};

		exports.edit = function(el) {
			var id = ATTRD(el);
			exports.tapi('Widgets|read @showloading ERROR', { id: id }, function(response) {
				var opt = {};
				opt.body = response.html;
				opt.callback = function(value, hide) {
					var model = {};
					model.id = id;
					model.html = value;
					exports.tapi('Widgets|save ERROR @saved', model, function() {
						exports.refresh();
						hide();
					});
				};
				SETTER('loading/hide', 1000);
				FUNC.code(opt);
			});
		};

		exports.options = function(el) {
			var items = exports.model.items;
			var id = ATTRD(el);
			var data = items.findItem('id', id);
			var opt = {};
			opt.element = el;
			opt.align = 'right';
			opt.items = [];
			opt.items.push({ id: 'code', name: '@(Edit)', icon: 'ti ti-laptop-code' });
			opt.items.push('-');
			opt.items.push({ id: 'remove', name: '@(Remove)', icon: 'ti ti-trash red' });
			opt.callback = function(item) {

				if (item.id === 'code') {
					exports.edit(id);
					return;
				}

				if (item.id === 'remove') {
					SETTER('approve/show', '@(Are you sure you want to remove the "{name}" widget?)'.args(data, 'escape'), '"ti ti-trash" @(Remove)', function() {
						exports.tapi('Widgets|remove @showloading', { id: id }, function() {
							FLAGS('@removed');
							exports.refresh();
						});
					});
				}

			};
			SETTER('menu/show', opt);
		};

		ON('Widgets/refresh', function() {
			setTimeout(function() {
				exports.refresh();
			}, 1000);
		});

	});

</script>
