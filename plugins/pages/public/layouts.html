<style>
	.CLASS .item { background-color: #F5F5F5; border-radius: var(--radius); }
	.CLASS .item > .item-hidden { background-color: #FFE8E8; }
	.CLASS .item > .item-highlight { background-color: #F9F8DE; }
	.CLASS .item > div { background: #ECECEC; padding: 8px; margin-bottom: 2px; border-radius: var(--radius); }
	.CLASS .item > div > div { margin-right: 20px; }
	.CLASS .item .exec { cursor: pointer; }

	.clevel { background-color: var(--color); color: #FFF; border-radius: var(--radius); padding: 0 3px; margin-right: 5px; }
</style>

<ui-component name="box" path="*form" config="if:CLASS;icon:ti ti-layer-group;title:@(Layouts);reload:?/reload;scrollbar:1;close:?/hide;width:800;hide:?/hide" class="hidden CLASS" plugin="CLASS">
	<nav>
		<button class="exec" data-exec="?/create"><i class="ti ti-plus-circle green"></i>@(Create)</button>
	</nav>
	<div>
		<ui-component name="empty" path="?.items" config="parent:auto" class="invisible">

			<script type="text/html">
				<div>@(No records found.)</div>
			</script>

			<div class="padding">
				<ui-bind path="?.items" config="template:figure" class="listing2">
					<script type="text/html">
					{{ foreach m in value }}
					<figure class="exec" data-exec="?/edit" data-id="{{ m.id }}" data-search="{{ m.name }}"{{ if m.color }} style="background-color:{{ m.color | rgba(0.2) }}"{{ fi }}>
						<section>
							<div class="controls">
								<span class="exec" data-exec="?/options" data-prevent="true" title="@(Options)"><i class="ti ti-cog"></i></span>
							</div>
							<div>
								<i class="{{ m.icon | empty('ti ti-layout') }} icon mr10"></i>
								{{ m.name }}
							</div>
						</section>
					</figure>
					{{ end }}
					</script>
				</ui-bind>
			</div>

		</ui-component>
	</div>
	<nav>
		<button name="cancel" style="width:100%">@(Close)</button>
	</nav>
</ui-component>

<script>

	PLUGIN(function(exports) {

		let Form = 'formlayoutpluginpages';
		let reload = false;

		exports.reload = function() {
			exports.refresh();
			reload = false;
		};

		exports.refresh = function(el) {
			reload = true;
			el && el.find('i').aclass('ti-spin').rclass('ti-spin', 800);
			exports.tapi('Layouts', function(response) {
				response.quicksort('name_asc');
				exports.set('items', response);
			});
		};

		exports.edit = function(el) {
			let id = ATTRD(el);
			exports.tapi('Layouts|read ERROR', { id: id }, function(response) {
				SET(Form + ' @reset', response);
				SET('*form2', Form);
			});
		};

		exports.options = function(el) {
			let items = exports.model.items;
			let id = el.attrd2('id');
			let data = items.findItem('id', id);
			let opt = {};
			opt.element = el;
			opt.align = 'right';
			opt.items = [];
			opt.items.push({ id: 'edit', name: '@(Edit)', icon: 'ti ti-pencil' });
			opt.items.push({ id: 'clone', name: '@(Clone)', icon: 'ti ti-clone' });
			opt.items.push('-');
			opt.items.push({ id: 'remove', name: '@(Remove)', icon: 'ti ti-trash red' });
			opt.callback = function(item) {

				if (item.id === 'edit') {
					exports.edit(id);
					return;
				}

				if (item.id === 'clone') {
					exports.tapi('Layouts|clone', { id: id }, ASETTER('notify/response', '@(The layout has been cloned successfully)', function(response) {
						exports.refresh();
						exports.edit(response.value);
					}));
					return;
				}

				if (item.id === 'remove') {
					SETTER('approve/show', '@(Are you sure you want to remove selected layout?)', ':remove: @(Remove)', function() {
						exports.tapi('Layouts|remove ERROR', { id: id }, function() {
							FLAGS('@removed');
							exports.refresh(el);
						});
					});
				}

			};
			SETTER('menu/show', opt);
		};

		exports.create = function() {
			AJAX('GET /_pages/template.txt', function(response) {
				SET(Form + ' @default', { html: response });
				SET('*form2', Form);
			});
		};

		exports.hide = function() {
			reload && NAV.refresh();
		};

	});


</script>
