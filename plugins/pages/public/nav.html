<style>
	.CLASS .listing2 figure { margin-bottom: 10px; }
</style>

<ui-component name="box" path="*form" config="if:CLASS;icon:ti ti-navicon;title:@(Navigation);reload:?/reload;scrollbar:1;close:?/hide;width:800;hide:?/hide" class="hidden CLASS" plugin="CLASS">
	<nav>
		<button class="exec" data-exec="?/create"><i class="ti ti-plus-circle green mr5"></i>@(Create)</button>
	</nav>
	<div>
		<ui-component name="empty" path="?.items" config="parent:auto" class="invisible">

			<script type="text/html">
				<div>@(No records found.)</div>
			</script>

			<div class="padding">
				<ui-bind path="?.items" config="template:figure" class="listing2 mt10">
					<script type="text/html">
						{{ foreach m in value }}
						<figure class="exec" data-exec="?/edit" data-id="{{ m.id }}" data-search="{{ m.name }}"{{ if m.color }} style="background:{{ m.color | rgba(0.2) }}"{{ fi }}>
							<section>
								<div class="controls">
									<span class="exec" data-exec="?/options" data-prevent="true" title="@(options)"><i class="ti ti-cog"></i></span>
								</div>
								<div>
									<i class="{{ m.icon | empty('ti ti-arrow-right') }} icon mr10"></i>
									{{ m.name }}
								</div>
							</section>
						</figure>
						{{ end }}
					</script>
				</ui-bind>
			</div>

		</ui-component>
	</div>
	<nav>
		<button name="cancel" style="width:100%">@(Close)</button>
	</nav>
</ui-component>

<script>

	PLUGIN(function(exports) {

		let FormSitemap = 'formsitemappluginpages';
		let FormNav = 'formnavformpluginpages';
		let reload = false;

		exports.reload = function() {
			exports.refresh();
		};

		exports.refresh = function(el) {
			el && el.find('i').aclass('ti-spin').rclass('ti-spin', 800);
			exports.tapi('Nav', 'items');
		};

		exports.editform = function(el) {
			var id = ATTRD(el);
			exports.tapi('Nav|read ERROR', { id: id }, function(response) {
				SET(FormNav + ' @reset', response);
				SET('*form2', FormNav);
			});
		};

		exports.edit = function(el) {
			var id = ATTRD(el);
			exports.tapi('Nav|read ERROR', { id: id }, function(response) {
				SET(FormSitemap + ' @reset', response);
				SET('*form2', FormSitemap);
			});
		};

		exports.options = function(el) {
			var items = exports.model.items;
			var id = el.attrd2('id');
			var data = items.findItem('id', id);
			var opt = {};
			opt.element = el;
			opt.align = 'right';
			opt.items = [];
			opt.items.push({ id: 'sitemap', name: '@(Open)', classname: 'b', icon: 'ti ti-bars' });
			opt.items.push({ id: 'form', name: '@(Edit)', icon: 'ti ti-pencil' });
			opt.items.push('-');
			opt.items.push({ id: 'remove', name: '@(Remove)', icon: 'ti ti-trash red' });
			opt.callback = function(item) {

				if (item.id === 'form') {
					exports.editform(id);
					return;
				}

				if (item.id === 'sitemap') {
					exports.edit(id);
					return;
				}

				if (item.id === 'remove') {
					SETTER('approve/show', '@(Are you sure you want to remove selected navigation?)', ':ti ti-remove: @(Remove)', function() {
						exports.tapi('Nav|remove ERROR', { id: id }, function() {
							FLAGS('@removed');
							exports.refresh(el);
						});
					});
					return;
				}

			};
			SETTER('menu/show', opt);
		};

		exports.create = function() {
			SET(FormNav + ' @default', {});
			SET('*form2', FormNav);
		};

	});

</script>
