<style>
	.CLASS .listing2 figure { margin-bottom: 10px; }
	.CLASS .listing2 .permanent { background-color: #F6E7EA; }
</style>

<ui-component name="box" path="*form" config="if:CLASS;icon:ti ti-exchange;title:@(Redirects);reload:?/reload;scrollbar:1;close:?/hide;width:800;hide:?/hide" class="hidden CLASS" plugin="CLASS">
	<nav>
		<button class="exec" data-exec="?/create"><i class="ti ti-plus-circle green mr5"></i>@(Create)</button>
	</nav>
	<div>
		<ui-component name="empty" path="?.items" config="parent:auto" class="invisible">

			<script type="text/html">
				<div>@(No records found.)</div>
			</script>

			<div class="padding">
				<ui-bind path="?.items" config="template:figure" class="listing2 mt10">
					<script type="text/html">
						{{ foreach m in value }}
							<figure class="exec{{ if m.ispermanent }} permanent{{ fi }}" data-exec="?/edit" data-id="{{ m.id }}" data-search="{{ m.url }} {{ m.target }}">
								<section>
									<div class="controls">
										<span class="exec" data-exec="?/options" data-prevent="true" title="@(Options)"><i class="ti ti-cog"></i></span>
									</div>
									<div>
										<i class="ti ti-exchange icon mr10"></i>
										<code class="b">{{ m.url }}</code> to <code class="b">{{ m.target }}</code>
									</div>
								</section>
							</figure>
						{{ end }}
					</script>
				</ui-bind>
			</div>

		</ui-component>
	</div>
	<nav>
		<button name="cancel" style="width:100%">@(Close)</button>
	</nav>
</ui-component>

<script>

	PLUGIN(function(exports) {

		let Form = 'formredirectpluginpages';

		exports.reload = function() {
			exports.refresh();
		};

		exports.refresh = function(el) {
			el && el.find('i').aclass('ti-spin').rclass('ti-spin', 800);
			exports.tapi('Redirects @showloading', 'items @hideloading');
		};

		exports.edit = function(el) {
			var id = ATTRD(el);
			exports.tapi('Redirects|read ERROR', { id: id }, function(response) {
				SET(Form + ' @reset', response);
				SET('*form2', Form);
			});
		};

		exports.options = function(el) {
			var items = exports.model.items;
			var id = el.attrd2('id');
			var data = items.findItem('id', id);
			var opt = {};
			opt.element = el;
			opt.align = 'right';
			opt.items = [];
			opt.items.push({ id: 'edit', name: '@(Edit)', icon: 'ti ti-pencil' });
			opt.items.push('-');
			opt.items.push({ id: 'remove', name: '@(Remove)', icon: 'ti ti-trash red' });
			opt.callback = function(item) {

				if (item.id === 'edit') {
					exports.edit(id);
					return;
				}

				if (item.id === 'remove') {
					SETTER('approve/show', '@(Are you sure you want to remove selected redirect?)', ':remove: @(Remove)', function() {
						exports.tapi('Redirects|remove ERROR', { id: id }, function() {
							FLAGS('@removed');
							exports.refresh();
						});
					});
				}

			};
			SETTER('menu/show', opt);
		};

		exports.create = function() {
			SET(Form + ' @default', {});
			SET('*form2', Form);
		};

	});

</script>
